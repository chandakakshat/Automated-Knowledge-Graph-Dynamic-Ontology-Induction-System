version: '3.8'

services:
  neo4j:
    image: neo4j:5.20.0-community
    container_name: avathon_neo4j
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/industrial_kg_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  kg-app:
    build: .
    container_name: avathon_kg_app
    ports:
      - "8501:8501"   # Streamlit UI
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=industrial_kg_password
      - LOCAL_MODEL=true
    volumes:
      - .:/workspace
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data: